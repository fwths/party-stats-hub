# fly.toml app configuration file generated for party-stats-hub on 2026-06-20T19:22:09+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'party-stats-hub'
primary_region = 'fra'

[build]

[env]
  DATABASE_URL = '/data/sqlite.db'
  PORT = '3000'

[[mounts]]
  source = 'db_volume'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
